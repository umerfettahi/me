
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080808">

    <meta name="description" content="Contact Umer Fettahi, developer.">

    <title>Umer Fettahi — Contact</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="site-shell">

    <header class="site-header">
        <a class="brand" href="#top">&lt;/&gt;</a>

        <a class="nav-contact" href="#contact">
            <span class="nav-dot"></span>
            Contact
        </a>
    </header>


    <main id="top">

        <section class="contact-hero" id="contact">

            <div class="hero-copy">

                <p class="eyebrow">
                    GET IN TOUCH
                    <span></span>
                </p>

                <h1>
                    Let’s <span>Connect</span>
                </h1>

                <p class="intro">
                    I’m a developer, always open to new opportunities,
                    <br class="desktop-break">
                    collaborations and interesting conversations.
                </p>


                <nav class="contact-links" aria-label="Contact links">

                    <!-- Email -->
                    <a class="contact-link"
                       href="mailto:umerfettahi@gmail.com">

                        <svg viewBox="0 0 24 24">
                            <rect x="2.5" y="4.5"
                                  width="19" height="15" rx="2"/>
                            <path d="m3.5 6 8.5 7 8.5-7"/>
                        </svg>

                        <span>umerfettahi@gmail.com</span>
                    </a>


                    <!-- Telegram -->
                    <a class="contact-link"
                       href="https://t.me/umerfettahi"
                       target="_blank"
                       rel="noopener noreferrer">

                        <svg viewBox="0 0 24 24">
                            <path d="m21.5 3-3.2 18-7.1-5.3-3.7 3.5.6-6.1L18 5.3 6.7 12.2 2 10.4 21.5 3Z"/>
                        </svg>

                        <span>
                            umerfettahi
                            <small>(Telegram)</small>
                        </span>
                    </a>


                    <!-- Instagram -->
                    <a class="contact-link"
                       href="https://www.instagram.com/umerfettahi/"
                       target="_blank"
                       rel="noopener noreferrer">

                        <svg viewBox="0 0 24 24">
                            <rect x="3" y="3"
                                  width="18" height="18" rx="5"/>
                            <circle cx="12" cy="12" r="4"/>
                            <circle class="solid"
                                    cx="17.6" cy="6.7" r="1"/>
                        </svg>

                        <span>
                            umerfettahi
                            <small>(Instagram)</small>
                        </span>
                    </a>

                </nav>

            </div>


            <!-- Your portrait -->
            <div class="portrait-wrap">

                <div class="portrait-shade"></div>

                <img src="portrait.jpg" alt="Umer Fettahi">

            </div>

        </section>

    </main>


    <footer class="site-footer">

        <span>
            © <span id="year"></span>. All rights reserved.
        </span>

        <span class="footer-credit">
            Built with passion for code.
            <b>&lt;/&gt;</b>
        </span>

    </footer>

</div>

<script src="script.js"></script>

</body>
</html>
